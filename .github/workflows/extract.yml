name: Validate macOS 27 native PingFang
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Inspect native PingFang
        run: |
          swiftc -O probe.swift -o /tmp/probe
          /tmp/probe evidence
          sw_vers > evidence/runner.txt
          echo "Runner image: $ImageOS $ImageVersion" >> evidence/runner.txt
          shasum -a 256 /System/Library/PrivateFrameworks/FontServices.framework/Versions/A/Resources/Reserved/PingFangUI.ttc >> evidence/runner.txt
      - uses: actions/upload-artifact@v7
        with:
          name: pingfang-macos27
          path: evidence
          retention-days: 3
