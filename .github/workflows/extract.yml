name: Extract Windows, macOS, and Android fonts
on: [push, pull_request, workflow_dispatch]

jobs:
  extract-macos:
    runs-on: xcode-27 # macOS 27: https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Test extraction and manifests
        run: python -m unittest discover -s tests -v
      - name: Extract fonts and generate manifest
        run: python scripts/extract_fonts.py macos
      - name: Upload fonts and manifest
        uses: actions/upload-artifact@v7
        with:
          name: fonts-mac
          path: dist/fonts-mac.*
          if-no-files-found: error
          compression-level: 0
  extract-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Test extraction and manifests
        run: python -m unittest discover -s tests -v
      - name: Download fonts and generate manifest
        run: python scripts/extract_fonts.py android
      - name: Upload fonts and manifest
        uses: actions/upload-artifact@v7
        with:
          name: fonts-android
          path: dist/fonts-android.*
          if-no-files-found: error
          compression-level: 0
  extract-windows:
    runs-on: windows-2025 # see: https://github.com/actions/runner-images?tab=readme-ov-file#available-images
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Test extraction and manifests
        run: python -m unittest discover -s tests -v
      - name: Checkout other repo
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.REPO }}
          token: ${{ secrets.PAC }}
          path: ./repo
      - name: Extract fonts and generate manifests
        run: python scripts/extract_fonts.py windows
      - name: Upload Windows fonts and manifest
        uses: actions/upload-artifact@v7
        with:
          name: fonts-win
          path: dist/fonts-win.*
          if-no-files-found: error
          compression-level: 0
      - name: Upload Office fonts and manifest
        uses: actions/upload-artifact@v7
        with:
          name: fonts-office
          path: dist/fonts-office.*
          if-no-files-found: error
          compression-level: 0
      - name: Upload Windows 11 fonts and manifest
        uses: actions/upload-artifact@v7
        with:
          name: fonts-win11
          path: dist/fonts-win11.*
          if-no-files-found: error
          compression-level: 0
  upload:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [extract-macos, extract-windows, extract-android]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/fonts-mac.zip
            dist/fonts-mac.json
            dist/fonts-win.zip
            dist/fonts-win.json
            dist/fonts-win11.zip
            dist/fonts-win11.json
            dist/fonts-office.zip
            dist/fonts-office.json
            dist/fonts-android.zip
            dist/fonts-android.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
