name: Extract Windows, macOS, and Android fonts
# Manifest format and local usage: .github/workflows/extract.md
on: [push, pull_request, workflow_dispatch]

jobs:
  extract-macos:
    runs-on: xcode-27 # macOS 27: https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Extract fonts and generate manifest
        run: python scripts/extract_fonts.py macos
      - name: Upload fonts-mac.zip
        uses: actions/upload-artifact@v7
        with:
          path: dist/fonts-mac.zip
          archive: false # artifact is named after the file
          if-no-files-found: error
      - name: Upload fonts-mac.json
        uses: actions/upload-artifact@v7
        with:
          path: dist/fonts-mac.json
          archive: false # artifact is named after the file
          if-no-files-found: error
  extract-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Test extraction and manifests
        run: python -m unittest discover -s tests -v
      - name: Download fonts and generate manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/extract_fonts.py android
      - name: Upload fonts-android.zip
        uses: actions/upload-artifact@v7
        with:
          path: dist/fonts-android.zip
          archive: false # artifact is named after the file
          if-no-files-found: error
      - name: Upload fonts-android.json
        uses: actions/upload-artifact@v7
        with:
          path: dist/fonts-android.json
          archive: false # artifact is named after the file
          if-no-files-found: error
  extract-windows:
    runs-on: windows-2025 # see: https://github.com/actions/runner-images?tab=readme-ov-file#available-images
    env:
      # Fork PRs don't receive secrets: skip the private repository there, but fail loudly everywhere else.
      EXTRACT: ${{ (secrets.REPO != '' && secrets.PAC != '') || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Test extraction and manifests
        run: python -m unittest discover -s tests -v
      - name: Skip extraction without secrets
        if: env.EXTRACT != 'true'
        run: echo "::warning::REPO/PAC secrets are unavailable (fork PR); skipping Windows font extraction."
      - name: Checkout other repo
        if: env.EXTRACT == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ secrets.REPO }}
          token: ${{ secrets.PAC }}
          path: ./repo
      - name: Extract fonts and generate manifests
        if: env.EXTRACT == 'true'
        run: python scripts/extract_fonts.py windows
      - name: Upload fonts-win.zip
        if: env.EXTRACT == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: dist/fonts-win.zip
          archive: false # artifact is named after the file
          if-no-files-found: error
      - name: Upload fonts-win.json
        if: env.EXTRACT == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: dist/fonts-win.json
          archive: false # artifact is named after the file
          if-no-files-found: error
      - name: Upload fonts-office.zip
        if: env.EXTRACT == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: dist/fonts-office.zip
          archive: false # artifact is named after the file
          if-no-files-found: error
      - name: Upload fonts-office.json
        if: env.EXTRACT == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: dist/fonts-office.json
          archive: false # artifact is named after the file
          if-no-files-found: error
      - name: Upload fonts-win11.zip
        if: env.EXTRACT == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: dist/fonts-win11.zip
          archive: false # artifact is named after the file
          if-no-files-found: error
      - name: Upload fonts-win11.json
        if: env.EXTRACT == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: dist/fonts-win11.json
          archive: false # artifact is named after the file
          if-no-files-found: error
  upload:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [extract-macos, extract-windows, extract-android]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: fonts-*
          path: dist
          merge-multiple: true
          skip-decompress: true # keep the font ZIPs as-is instead of extracting them
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/fonts-mac.zip
            dist/fonts-mac.json
            dist/fonts-win.zip
            dist/fonts-win.json
            dist/fonts-win11.zip
            dist/fonts-win11.json
            dist/fonts-office.zip
            dist/fonts-office.json
            dist/fonts-android.zip
            dist/fonts-android.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
